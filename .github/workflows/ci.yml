name: CI

on:
  pull_request:
  push:
    branches: [main, Development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run public pytest suite
        run: python -m pytest -q

      - name: Run Python coverage gate
        if: matrix.python-version == '3.12'
        # Current-floor gate; raise --cov-fail-under as public coverage grows.
        run: >
          python -m pytest
          --cov=app
          --cov=aift
          --cov=aift_cli
          --cov=aift_mcp
          --cov=runtime_compat
          --cov-report=term-missing
          --cov-fail-under=60
          -q

  mcp-smoke:
    name: MCP Smoke
    runs-on: ubuntu-latest
    env:
      # Turn the smoke test's missing-SDK skip into a hard failure so an MCP
      # SDK rename or install breakage cannot silently pass this job.
      AIFT_REQUIRE_MCP: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check MCP entry point help
        run: python aift_mcp.py --help

      - name: Run real MCP stdio smoke test
        run: >
          python -m pytest
          tests/test_mcp_protocol_smoke.py::TestMCPProtocolSmoke::test_stdio_client_can_initialize_list_and_call_safe_tools
          -q
          -rs

  javascript:
    name: JavaScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Jest suite
        run: npm test -- --runInBand

      - name: Run Jest coverage gate
        run: npm test -- --runInBand --coverage
