[pytest]
testpaths = tests
markers =
    browser_flow: jsdom browser-level frontend flow coverage with mocked network/SSE
    concurrency: tests that exercise real thread coordination or cancellation
    requires_symlink: tests that require filesystem symlink support
norecursedirs =
    .*
    build
    dist
    CVS
    _darcs
    {arch}
    *.egg
    .venv
    venv
    node_modules
    local_tests
